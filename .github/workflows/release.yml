name: Release

# Triggers on a v* tag (e.g. v0.1.0). The job runs the project's full
# CI gate, builds a wheel + sdist, validates them, and uploads to PyPI
# via trusted publishing — no API token needed (configure on PyPI:
# https://docs.pypi.org/trusted-publishers/).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required by PyPI trusted publishing

jobs:
  release:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ootle-py/
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run CI gate
        run: make ci

      - name: Build wheel + sdist
        run: make build

      - name: Verify wheel bundles the WASM blob
        run: |
          unzip -l dist/ootle_py-*.whl | grep -q ootle_wasm_bg.wasm
          unzip -l dist/ootle_py-*.whl | grep -q VERSION

      - name: Validate distributions
        run: uv run --with twine twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
