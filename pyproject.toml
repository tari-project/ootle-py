[project]
name = "ootle-py"
version = "0.1.0"
description = "Async-first Python client library for the Tari L2 (Ootle) network."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BSD-3-Clause" }
authors = [{ name = "The Tari Project" }]
keywords = ["tari", "ootle", "blockchain", "layer-2", "wasm", "async", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cbor2>=5.6",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "wasmtime>=44.0.0",
]

[project.urls]
Homepage = "https://github.com/tari-project/ootle-python"
Documentation = "https://github.com/tari-project/ootle-python/tree/main/docs"
Repository = "https://github.com/tari-project/ootle-python"
Issues = "https://github.com/tari-project/ootle-python/issues"
Changelog = "https://github.com/tari-project/ootle-python/blob/main/CHANGELOG.md"

[project.scripts]
ootle = "ootle.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ootle"]

[tool.hatch.build.targets.wheel.force-include]
"src/ootle/_crypto/wasm/ootle_wasm_bg.wasm" = "ootle/_crypto/wasm/ootle_wasm_bg.wasm"
"src/ootle/_crypto/wasm/VERSION" = "ootle/_crypto/wasm/VERSION"

[tool.hatch.build.targets.sdist]
include = [
    "src/ootle/**",
    "src/ootle/_crypto/wasm/ootle_wasm_bg.wasm",
    "src/ootle/_crypto/wasm/VERSION",
    "scripts/**",
    "tests/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# uv — package & environment manager
# ---------------------------------------------------------------------------
[tool.uv]
required-version = ">=0.8.13"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "unasync>=0.6.0",
    "pytest-httpx>=0.36.2",
    "pytest-asyncio>=1.3.0",
]

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "N",      # pep8-naming
    "ANN",    # flake8-annotations (require type hints)
    "PTH",    # flake8-use-pathlib
    "PIE",    # flake8-pie
    "PL",     # pylint
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "ERA",    # eradicate (commented-out code)
    "PERF",   # perflint
    "S",      # flake8-bandit (security)
]
ignore = [
    "ANN401",  # allow Any in narrow cases
    "PLR0913", # too many arguments — pragmatic default
]
unfixable = ["ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ANN", "PLR2004", "ARG", "SIM117", "TC001", "TC002", "TC003", "PERF401", "PERF402"]
"scripts/**/*.py" = ["S101", "T201"]
"__init__.py" = ["F401"]
# Generated by `make unasync`; the `_async → _sync` rename can land
# entries out of alphabetical order. Don't hand-fix.
"src/ootle/_sync/**/*.py" = ["I001", "RUF022"]
"tests/_sync/**/*.py" = ["I001", "RUF022"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ootle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Pyright — static type checker (strict)
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "warning"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportPrivateUsage = "error"
reportConstantRedefinition = "error"
reportDeprecated = "warning"
reportDuplicateImport = "error"
reportUnnecessaryCast = "warning"
reportUnnecessaryIsInstance = "warning"
reportImplicitOverride = "error"

# ---------------------------------------------------------------------------
# pytest — test runner
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--import-mode=importlib",
    "-m",
    "not integration",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "stealth: marks stealth integration tests (require a LocalNet indexer)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:_pytest.*",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/ootle"]
parallel = true
# The generated `_sync/stealth/` mirror is byte-equivalent to its
# `_async/` source — parity is enforced by `make ci-verify-sync`. We
# skip coverage for the generator's output so we don't need a
# duplicated test corpus. The same applies to the stealth-aware
# sibling files in `_sync/` that import the mirror.
omit = [
    "src/ootle/_sync/stealth/*",
    "src/ootle/_sync/_client_stealth_reads.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 89
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
